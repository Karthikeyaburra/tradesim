spring.application.name=tradesim-test
spring.config.import=optional:file:./local.properties

# Integration tests run against a real MySQL database (tradesim_test), because the
# concurrency guarantees under test are MySQL/InnoDB guarantees.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tradesim_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20
spring.sql.init.mode=always

# Prices must stay hermetic and still while tests assert on exact rupee calculations.
tradesim.market-sync.enabled=false
tradesim.price-engine.enabled=false
tradesim.session.ttl-hours=8
tradesim.zone=Asia/Kolkata
tradesim.admin.username=admin
tradesim.admin.password=admin123
