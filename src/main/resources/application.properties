spring.application.name=tradesim-server
server.port=${PORT:8080}

# Local secrets (DB password) live in ./local.properties, which is git-ignored.
spring.config.import=optional:file:./local.properties

# MySQL 8 - supports both DB_* and Railway's native MYSQL* environment variables automatically.
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:tradesim}}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=20

# Run src/main/resources/schema.sql on every start (all statements are idempotent).
spring.sql.init.mode=always

# TradeSim auth & admin settings
tradesim.session.ttl-hours=8
tradesim.zone=Asia/Kolkata
tradesim.admin.username=admin
tradesim.admin.password=${ADMIN_PASSWORD:admin123}

# Hybrid Market Engine: syncs real NSE quotes + 5m intraday series every 60s, with 1.5s SSE micro-ticks 24/7
tradesim.market-sync.enabled=${MARKET_SYNC_ENABLED:true}
tradesim.market-sync.initial-delay-ms=400
tradesim.market-sync.interval-ms=60000
tradesim.price-engine.enabled=true
tradesim.price-engine.interval-ms=1500
tradesim.price-engine.volatility=0.0012
tradesim.price-engine.circuit-limit=0.20
tradesim.price-engine.floor=1.00
tradesim.price-history.retention-hours=24
