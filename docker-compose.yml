services:
  mysql:
    image: mysql:8.0
    container_name: tradesim-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tradesim_secret}
      MYSQL_DATABASE: tradesim
    ports:
      - "3307:3306"
    volumes:
      - tradesim_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: tradesim-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: tradesim
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-tradesim_secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"

volumes:
  tradesim_mysql_data:

